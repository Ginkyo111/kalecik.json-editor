(function(){
  var L={fr:'Démarrage…',en:'Starting…',tr:'Başlatılıyor…',es:'Iniciando…',de:'Wird gestartet…'},l='fr';

})();
</script>

<script id="genSrc">
// Pas de la grille de hauteur (unités monde par échantillon). Un chunk = CH échantillons = CH*CS unités.
// Mesuré en jeu (carte de calibration) : 0,75 u par échantillon, soit des chunks de 24 u. Surcharge possible : ?cs=0.5
const CH = 32;
const CS = (() => { try { const v = parseFloat(new URLSearchParams(location.search).get('cs')); return v > 0 ? v : 0.75; } catch (e) { return 0.75; } })();
const U = CS * CH;            // taille d'un chunk en unités monde
// Niveau de l'eau dans l'aperçu (hauteur en u). Mesuré en jeu (carte de calibration) : la ligne d'eau tombe à ≈ -0,5 u.
// Surcharge possible : ?wl=0.07
const WL = (() => { try { const v = parseFloat(new URLSearchParams(location.search).get('wl')); return isFinite(v) ? v : -0.5; } catch (e) { return -0.5; } })();
const SK = 0.5 / CS;          // conversion des sigmas (calibrés à 0,5 u/échantillon)
const tick = () => new Promise(r => setTimeout(r, 0));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ramp = v => v * v * (3 - 2 * v);
const wtEase = t => t * t * (1.4 - 0.4 * t);   // dégradé des petits fonds : pente nulle côté eau profonde (plus de limite nette), clair seulement près de la côte
// bruit pour les bords de la carte (déterministe, valeurs dans [-1, 1]) : partagé par le relief (génération) et la couleur (aperçus 2D/3D)
const eHash = (ix, iz, s) => { let h = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(s | 0, 1013904223)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 2147483647.5 - 1; };
const eVal = (x, z, s) => {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);

};
const edgeWave = (x, z, s) => eVal(x / 55 + 3.3, z / 55 - 8.1, s + 3) * 0.45 + eVal(x / 24, z / 24, s) * 0.4 + eVal(x / 9 + 31.7, z / 9 - 17.3, s + 7) * 0.3;                // contour ondulé du fondu
const edgeGrain = (x, z, s) => eVal(x / 3.2 + 9.1, z / 3.2 + 4.4, s + 13) * 0.6 + eVal(x / 1.4 - 5.2, z / 1.4 + 11.8, s + 19) * 0.4;   // grain fin

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const r = mulberry32(seed >>> 0);

  return {
    random: r,
    uniform: (a, b) => a + (b - a) * r(),
    int: (a, b) => a + Math.floor(r() * (b - a)),
    choice: arr => arr[Math.floor(r() * arr.length)],
    normal() {
      if (spare !== null) { const s = spare; spare = null; return s; }

      const v = r(), m = Math.sqrt(-2 * Math.log(u));
      spare = m * Math.sin(2 * Math.PI * v);
      return m * Math.cos(2 * Math.PI * v);
    }
  };
}

function gaussian(src, N, sigma) {
  const rad = Math.floor(4 * sigma + 0.5);
  const K = 2 * rad + 1;
  const k = new Float32Array(K);
  let sum = 0;
  for (let i = -rad; i <= rad; i++) { k[i + rad] = Math.exp(-0.5 * i * i / (sigma * sigma)); sum += k[i + rad]; }
  for (let i = 0; i < k.length; i++) k[i] /= sum;
  const refl = i => { if (i < 0) i = -i - 1; if (i >= N) i = 2 * N - i - 1; return i < 0 ? 0 : i >= N ? N - 1 : i; };
  const tmp = new Float32Array(N * N), out = new Float32Array(N * N);
  // même ordre de sommation que la version naïve (résultat identique au bit près), mais sans appel refl() dans la boucle interne :
  // seuls les bords passent par la table d'indices réfléchis, et la 2e passe balaie les lignes (accès mémoire contigus)
  const lo = Math.min(rad, N), hi = Math.max(lo, N - rad);
  const ri = new Int32Array(N + 2 * rad);
  for (let i = 0; i < ri.length; i++) ri[i] = refl(i - rad);
  for (let r = 0; r < N; r++) {
    const o = r * N;
    for (let c = 0; c < lo; c++) { let s = 0; for (let j = 0; j < K; j++) s += k[j] * src[o + ri[c + j]]; tmp[o + c] = s; }
    for (let c = lo; c < hi; c++) { let s = 0; const b0 = o + c - rad; for (let j = 0; j < K; j++) s += k[j] * src[b0 + j]; tmp[o + c] = s; }
    for (let c = hi; c < N; c++) { let s = 0; for (let j = 0; j < K; j++) s += k[j] * src[o + ri[c + j]]; tmp[o + c] = s; }
  }
  const acc = new Float64Array(N);
  for (let r = 0; r < N; r++) {
    acc.fill(0);
    for (let j = 0; j < K; j++) {

      for (let c = 0; c < N; c++) acc[c] += kj * tmp[ro + c];

}

function placeIslands(rng, nBig, nSmall, half, gap, rbig, rsmall) {
  // La taille de la carte est fixe : si les îles ne tiennent pas, on réduit leurs rayons, l'écart et la marge de bord jusqu'à ce que tout rentre.
  const GF = [1, 0.75, 0.5, 0.3, 0.15, 0]; // d'abord on rapproche les îles (jusqu'à les coller), ensuite seulement on réduit leurs rayons
  for (let k = 0; ; k++) {
    const f = k < GF.length ? 1 : Math.pow(0.92, k - GF.length + 1), gf = k < GF.length ? GF[k] : 0;
    if (f < 0.08) throw new Error('Les îles ne tiennent pas dans la carte : réduisez leur nombre.');
    const margin = 34 * f, g = gap * gf;
    const rb = [rbig[0] * f, rbig[1] * f], rs = [Math.max(1, rsmall[0] * f), Math.max(1, rsmall[1] * f)];
    const placed = [], big = [], small = [];
    const tryPlace = (r, minGap, tries = 1500) => {
      for (let t = 0; t < tries; t++) {
        const lim = half - r - margin;
        if (lim <= 0) return null;
        const x = rng.uniform(-lim, lim), z = rng.uniform(-lim, lim);
        if (placed.every(([px, pz, pr]) => Math.hypot(x - px, z - pz) - r - pr >= minGap)) return [x, z, r];
      }
      return null;
    };
    let ok = true;
    for (let i = 0; i < nBig; i++) {
      const c = tryPlace(rng.uniform(rb[0], rb[1]), g);
      if (!c) { ok = false; break; }
      placed.push(c); big.push(c);
    }
    if (ok) {
      let all = true;
      for (let i = 0; i < nSmall; i++) {
        const c = tryPlace(rng.uniform(rs[0], rs[1]), 28 * g / 45);
        if (!c) { all = false; break; }
        placed.push(c); small.push(c);
      }
      if (all) return { big, small, half, scale: f };
    }
  }
}

async function generate(p, progress, cancelled) {
  const stage = async (pct, label) => {
    progress && progress(pct, label);
    await tick();
    if (cancelled && cancelled()) throw new Error('cancelled');
  };
  const t0 = Date.now();
  const seed = p.seed;
  const rng = makeRng(seed);
  // hauteur du monde infini (base_h) ; au-dessus du niveau de l'eau, le générateur bascule en paysage terrestre (pas d'îles)
  const WH = clamp(Number.isFinite(p.worldH) ? p.worldH : -6, -6, 12);
  const land = WH > WL + 0.01;
  // Profil de terrain propre à chaque hauteur de monde : plaines (part de terrain plat), collines, amplitude du bruit de fond,
  // échelle des montagnes (hauteur / emprise), terrasses (plateau : replats à bords raides), crêtes (hautes terres : relief vif).
  const prof = !land ? { plains: p.plains, hill: 1, landAmp: 1.4, mtn: 1, msz: 1, terrace: 0, ridge: 0 }
    : WH <= 3 ? { plains: 0.9, hill: 0.25, landAmp: 0.55, mtn: 0.95, msz: 2.0, pk: 2.5, irr: 0.45, fl: 0.3, mmin: 5.5, terrace: 0, ridge: 0 }       // Plaine : très plat, quelques ondulations
    : { plains: 0.1, hill: 1.2, landAmp: 2.8, mtn: 0.65, msz: 0.7, terrace: 4.5, tr: 0.55, tb: 0.55, ridge: 1.2, bowl: 9, belt: 1, minH: 3 };                // Hautes terres : plusieurs plateaux étagés, relief marqué, crêtes (+ canyons)
  const rlen = clamp(Math.round(Number.isFinite(p.riverLen) ? p.riverLen : 0), 0, 10);   // longueur des rivières (10 = boucle)
  const ww = clamp(Number.isFinite(p.waterWidth) ? p.waterWidth : 1, 0.4, 3);   // largeur des points d'eau (lacs, rivières)
  const wd = clamp(Number.isFinite(p.waterDepth) ? p.waterDepth : 2.5, 0.5, 6);   // profondeur des points d'eau (lacs, étangs, rivières) sous la ligne d'eau
  let half = Math.max(U, Math.round(p.size / U) * U);
  const pl = land ? placeIslands(rng, p.big, 0, half, 30, p.bigRadius, [1, 1]) : placeIslands(rng, p.big, p.small, half, p.gap, p.bigRadius, p.smallRadius);
  const big = pl.big, small = pl.small; half = pl.half;
  const msc = clamp(half / 96, 0.5, 3), wk = ww * msc;   // échelle selon la taille de la carte (96 = taille de référence) : montagnes, lacs, rivières
  const islands = big.concat(small);
  const kc = Math.max(1, (Number(p.size) || 120) / 120);   // les plafonds (massifs, lacs) suivent la taille de la carte (120 = référence)
  const A0 = -half / U, A1 = half / U - 1;
  const N = (A1 - A0 + 1) * CH, X0 = A0 * U;
  const NN = N * N;
  const xs = new Float32Array(N);
  for (let i = 0; i < N; i++) xs[i] = X0 + i * CS;

  function noise(scale, s) {
    const r = makeRng((seed * 1009 + s) >>> 0);
    const g = Math.max(2, Math.floor(N * CS / scale));
    const M = g + 3;
    const arr = new Float32Array(M * M);
    for (let i = 0; i < arr.length; i++) arr[i] = r.normal();
    const O = Math.round(M * N / g);
    const idx = new Int32Array(N * 4), w = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) {
      const src = O > 1 ? i * (M - 1) / (O - 1) : 0;
      const f = Math.floor(src), t = src - f, t2 = t * t, t3 = t2 * t;

      w[i * 4 + 1] = 1.5 * t3 - 2.5 * t2 + 1;
      w[i * 4 + 2] = -1.5 * t3 + 2 * t2 + 0.5 * t;
      w[i * 4 + 3] = 0.5 * t3 - 0.5 * t2;
      for (let q = 0; q < 4; q++) idx[i * 4 + q] = clamp(f - 1 + q, 0, M - 1);
    }
    const tmp = new Float32Array(M * N);
    for (let rr = 0; rr < M; rr++) {

    const t = new Float32Array(NN);

      for (let i = 0; i < NN; i++) t[i] += amp * n[i];

    for (let i = 0; i < NN; i++) t[i] /= tot;

  }

  const warp = fbm(40, 1, 4), w2 = fbm(14, 2, 3);
  const cn = p.coastNoise || 0;
  if (cn > 0) {
    const ca1 = fbm(7, 3, 3), ca2 = fbm(2.6, 4, 2);
    for (let i = 0; i < NN; i++) warp[i] = warp[i] * 9 + w2[i] * 3 + cn * (ca1[i] * 6 + ca2[i] * 2.5);

    for (let i = 0; i < NN; i++) warp[i] = warp[i] * 9 + w2[i] * 3;
  }

  const isR = new Float32Array(NN).fill(30);   // rayon de l'île qui définit chaque point (petites îles : la pente côtière est plus courte, un massif y reste visible)
  for (const [cx, cz, R] of (land ? [] : islands)) {
    const ph0 = rng.uniform(0, 6.28), ph1 = rng.uniform(0, 6.28);
    for (let r = 0; r < N; r++) {
      const z = xs[r];
      for (let c = 0; c < N; c++) {
        const x = xs[c];
        const ang = Math.atan2(z - cz, x - cx);
        const e = 1 + 0.25 * Math.sin(ang * 2 + ph0) + 0.12 * Math.sin(ang * 3 + ph1);
        const v = R * e - Math.hypot(x - cx, z - cz) + warp[r * N + c];
        if (v > sd[r * N + c]) { sd[r * N + c] = v; isR[r * N + c] = R; }
      }
    }
  }
  const thr = 0.9 - 1.7 * p.cliffs;
  let cliff;
  if (p.cliffs > 0) {
    cliff = fbm(55, 7, 2);
    for (let i = 0; i < NN; i++) cliff[i] = clamp((cliff[i] - thr) * 3, 0, 1);
    cliff = gaussian(cliff, N, 3 * SK);
  } else cliff = new Float32Array(NN);

  await stage(0.2, 'Montagnes');
  const peaks = [], flats = [], ridges = [], mains = [];
  // paysage terrestre : un massif par « massif » demandé (= p.big) ; archipel : les massifs ont leur propre curseur et ne sont plus
  // créés automatiquement sur chaque grande île (grandes îles d'abord, puis les plus grands îlots)
  // archipel : un massif se pose sur le point le plus intérieur de l'île (la côte bruitée peut réduire une petite île à presque rien : on préfère les îles qui ont vraiment de la terre),
  // grandes îles d'abord, puis les îlots classés par profondeur de terre ; ainsi chaque massif ajouté se voit tout de suite
  const siteOf = ([cx, cz, R]) => {
    let bv = -1e9, bx = cx, bz = cz;
    const c0 = clamp(Math.floor((cx - R - X0) / CS), 0, N - 1), c1 = clamp(Math.ceil((cx + R - X0) / CS), 0, N - 1);
    const r0 = clamp(Math.floor((cz - R - X0) / CS), 0, N - 1), r1 = clamp(Math.ceil((cz + R - X0) / CS), 0, N - 1);
    for (let r = r0; r <= r1; r += 2) for (let c = c0; c <= c1; c += 2) {

  const massifSites = land ? big : baseSites.slice(0, wantM);

  const mtnH = (land ? massifSites.length > 0 : wantM > 0) ? Math.max(p.mountain || 0, prof.mmin || 3) : (p.mountain || 0);
  const noMtn = !(mtnH > 0);   // hauteur à 0 et aucun sommet : les îles restent naturellement plates
  // plus de massifs demandés que d'îles (cas d'une île unique compris) : les massifs en trop se posent sur les mêmes îles, à bonne distance des précédents
  if (!land && baseSites.length) {
    const near = (isl, used) => {
      const [cx, cz, R] = isl;
      for (let f = 1; f >= 0.2; f -= 0.2) {
        const dm = clamp(R * 0.6, 12, 45) * f;
        let bv = -1e9, bx = 0, bz = 0, found = false;
        const c0 = clamp(Math.floor((cx - R - X0) / CS), 0, N - 1), c1 = clamp(Math.ceil((cx + R - X0) / CS), 0, N - 1);
        const r0 = clamp(Math.floor((cz - R - X0) / CS), 0, N - 1), r1 = clamp(Math.ceil((cz + R - X0) / CS), 0, N - 1);
        for (let r = r0; r <= r1; r += 2) for (let c = c0; c <= c1; c += 2) {
          if (Math.hypot(xs[c] - cx, xs[r] - cz) > R) continue;
          if (used.some(u => Math.hypot(xs[c] - u[0], xs[r] - u[1]) < dm)) continue;
          const v = sd[r * N + c]; if (v > bv) { bv = v; bx = xs[c]; bz = xs[r]; found = true; }
        }
        if (found && bv >= 4) return [bx, bz, R * 0.7, bv, bv];
      }
      return null;
    };
    for (let e = massifSites.length, fails = 0; e < wantM && fails < baseSites.length; e++) {
      const isl = baseSites[e % baseSites.length];
      const used = massifSites.filter(q => Math.hypot(q[0] - isl[0], q[1] - isl[1]) < isl[2] + 1 || q === isl);
      const q = near(isl, used.length ? used : [[isl[0], isl[1]]]);
      if (q) { massifSites.push(q); fails = 0; } else { fails++; }
    }
  }
  let mIdx = 0;
  for (const [cx, cz, R] of massifSites) {
    // générateur propre à chaque massif (indépendant du générateur principal) : ajouter, retirer ou modifier un massif ne décale ni les lacs ni les rivières
    const mr = makeRng((seed * 48271 + (mIdx++) * 7919 + 101) >>> 0);
    const baseAng = mr.uniform(0, 6.28);
    // une seule montagne par île ; le curseur de surface élargit ce massif et ajoute du relief autour (sommets satellites, crêtes en étoile, piémont)
    const ms = p.mtnSize, grow = Math.max(0, ms - 1);

      if (r > 0) {
        if (wdist[i - N] + 1 < d) d = wdist[i - N] + 1;
        if (c > 0 && wdist[i - N - 1] + 1.414 < d) d = wdist[i - N - 1] + 1.414;
        if (c < N - 1 && wdist[i - N + 1] + 1.414 < d) d = wdist[i - N + 1] + 1.414;
      }
      wdist[i] = d;
    }
    for (let r = N - 1; r >= 0; r--) for (let c = N - 1; c >= 0; c--) {
      const i = r * N + c; let d = wdist[i];
      if (c < N - 1 && wdist[i + 1] + 1 < d) d = wdist[i + 1] + 1;

    const cdp = clamp(Number.isFinite(p.canyonDepth) ? p.canyonDepth : 12, 2, 30);

      const a0 = amp * cr.uniform(0.8, 1.2), a1 = amp * cr.uniform(0.4, 0.7), a2 = amp * jag, pts = [];
      for (let q = 0; q <= n; q++) {

        const rA = clamp(Math.floor((pz - rad - X0) / CS), 0, N - 1), rB = clamp(Math.ceil((pz + rad - X0) / CS), 0, N - 1);

    for (let k = 0; k < nCany; k++) {
      let pts = null;
      for (let tr = 0; tr < 120 && !pts; tr++) {

        const sd0 = (k % 2) * 1 + 2 * Math.floor(cr.uniform(0, 2)), u0 = cr.uniform(-0.7, 0.7) * limC, u1 = cr.uniform(-0.7, 0.7) * limC;   // orientations alternées : les canyons se croisent plutôt que de se longer
        const bp = (sdx, u) => sdx === 0 ? [u, -limC] : sdx === 1 ? [limC, u] : sdx === 2 ? [u, limC] : [-limC, u];

  };

    }

  };

    const key = Math.floor(x / 3) + ',' + Math.floor(z / 3);

      a: +rng.uniform(-Math.PI, Math.PI).toFixed(3), id: nid, k,
      s: +rng.uniform(0.85, 1.2).toFixed(3), v: rng.int(0, 4),

  };

  const dec = ['tree', 'oak', 'beech', 'birch', 'maple', 'tree', 'oak', 'birch', 'beech'];
  const fruit = ['apple', 'cherry', 'poplar', 'old_oak'];
  const R = rng.random;
  // végétation selon le biome : hautes terres = pins (dont pins parasols), rochers et feuillus ; îles = feuillus et buissons ; plaines = mélange plus clairsemé
  const high = land && WH > 3, plainB = land && WH <= 3, hb = high ? WH - 3 : 0;

  };

    if (!clr && R() > 0.4 + 0.6 * nearWater(x, z)) return false;
    if (!free(x, z, 0.9)) return false;
    add(rng.choice(['daisy', 'poppy', 'bluebell', 'meadow', 'meadow', 'daisy', R() < 0.05 ? 'sunflower' : 'bluebell']), x, z, 0.9);

  };

    h -= hb;
    if (h > 9 || !free(x, z, 4.0)) return false;
    if (R() > (h < 2.2 ? 0.4 : 0.3 + 0.3 * nz(stones, x, z))) return false;
    add('boulder', x, z, 1.0); return true;
  };
  const fSnag = (x, z, h) => {
    if (h < 2 || h > 9 || !free(x, z, 1.2)) return false;
    add('snag', x, z, 1.2); return true;
  };
  sampleN(380 * kk, fDec, p.leaf * bm.leaf * vm); await stage(0.86, 'Végétation');
  sampleN(260 * kk, fCon, p.pine * bm.pine * vm); await stage(0.9, 'Végétation');
  sampleN(90 * kk, fBush, p.bush * bm.bush * vm); sampleN(320 * kk, fFlow, p.flower * bm.flower * vm); await stage(0.95, 'Végétation');

    H, N, half, A0, A1, X0, xs, big, small, props, seed, scale: pl.scale, nextId: nid + 10,

}

async function zlibB64(f32) {
  const stream = new Blob([f32]).stream().pipeThrough(new CompressionStream('deflate'));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let s = '';
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
}

const ORIENTS = [
  (i, j, N) => [i, j],
  (i, j, N) => [j, i],
  (i, j, N) => [i, N - 1 - j],
  (i, j, N) => [N - 1 - i, j],
  (i, j, N) => [N - 1 - i, N - 1 - j],
  (i, j, N) => [j, N - 1 - i],
  (i, j, N) => [N - 1 - j, i],
  (i, j, N) => [N - 1 - j, N - 1 - i]

async function buildJSON(res, progress, orient = 0) {
  const { H, N, A0, A1 } = res;
  const om = ORIENTS[orient] || ORIENTS[0];
  const terrain = {};
  const total = (A1 - A0 + 1) ** 2;
  let n = 0;
  for (let ca = A0; ca <= A1; ca++) {
    for (let cb = A0; cb <= A1; cb++) {
      const chunk = new Float32Array(CH * CH);
      let any = false;
      for (let r = 0; r < CH; r++) {
        const gi = (cb - A0) * CH + r, gj0 = (ca - A0) * CH;
        for (let c = 0; c < CH; c++) {
          const [si, sj] = om(gi, gj0 + c, N);
          const v = H[si * N + sj];
          chunk[r * CH + c] = v;
          if (Math.abs(v - res.worldH) > 0.01) any = true;
        }
      }
      if (any) terrain[ca + ',' + cb] = await zlibB64(chunk);
      if (++n % 40 === 0) { progress && progress(n / total); await tick(); }
    }
  }
  const F = v => Number.isInteger(v) ? '__F__' + v : v;
  const props = res.props.map(q => ({ a: F(q.a), id: F(q.id), k: q.k, s: F(q.s), v: F(q.v), x: F(q.x), z: F(q.z) }));
  const data = {
    base_h: F(res.worldH), bases: {}, decor_off: [], fields: [], houses: [], name: res.name,
    next_id: F(res.nextId), props, river_seed: F(-1), season: F(res.season),
    terrain2: terrain, terrain_rev: F(1), towers: [], version: F(2), walls: []
  };
  const text = JSON.stringify(data).replace(/"__F__(-?\d+)"/g, '$1.0');
  return { text, chunks: Object.keys(terrain).length };
}

</script>
