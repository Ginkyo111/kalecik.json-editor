<script>
// Nuages d'en-tête : bruit de Perlin 2D (fbm, 4 octaves) rendu en blanc translucide sur un petit canvas étiré (lissage naturel), dérive lente.
(function () {
  const cv = document.getElementById('clouds'); if (!cv) return;
  const ctx = cv.getContext('2d'); let img = null;
  let s = 1337; const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const perm = []; for (let i = 0; i < 256; i++) perm.push(i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  const P = new Uint8Array(512); for (let i = 0; i < 512; i++) P[i] = perm[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + (b - a) * t;
  const grad = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return x - y; case 2: return -x + y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  function perlin(x, y) {
    const fx = Math.floor(x), fy = Math.floor(y), X = fx & 255, Y = fy & 255;
    x -= fx; y -= fy;
    const u = fade(x), v = fade(y), a = P[X] + Y, b = P[X + 1] + Y;
    return lerp(lerp(grad(P[a], x, y), grad(P[b], x - 1, y), u), lerp(grad(P[a + 1], x, y - 1), grad(P[b + 1], x - 1, y - 1), u), v);
  }
  function fbm(x, y) { let t = 0, a = 0.5, f = 1; for (let o = 0; o < 4; o++) { t += a * perlin(x * f, y * f); a *= 0.5; f *= 2; } return t; }
  const sm = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
  function size() {
    const r = cv.parentNode.getBoundingClientRect(), H = 40;
    const W = Math.min(640, Math.max(80, Math.round(H * r.width / Math.max(1, r.height))));
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; img = ctx.createImageData(W, H); }
  }
  function draw(ts) {
    if (!img) size(); if (!img) return;
    const W = cv.width, H = cv.height, d = img.data, ox = ts * 0.0001, oy = ts * 0.00002;
    for (let y = 0; y < H; y++) {
      const ny = y / H, mask = 1 - sm(0.3, 1, ny);
      for (let x = 0; x < W; x++) {
        const f = fbm(x * 0.05 + ox, y * 0.07 + oy + 3.7), dd = Math.min(1, Math.max(0, 0.5 + 0.9 * f));
        const a = sm(0.5, 0.85, dd) * mask * 0.6, i = (y * W + x) * 4;
        d[i] = d[i + 1] = d[i + 2] = 255; d[i + 3] = a * 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = 0;
  function frame(ts) { if (ts - last > 50 && !document.hidden) { last = ts; draw(ts); } requestAnimationFrame(frame); }
  addEventListener('resize', () => { size(); if (still) draw(8000); });
  size(); draw(8000);
  if (!still) requestAnimationFrame(frame);
})();

<script>
// Pas de la grille de hauteur (unités monde par échantillon). Un chunk = CH échantillons = CH*CS unités.
// Mesuré en jeu (carte de calibration) : 0,75 u par échantillon, soit des chunks de 24 u. Surcharge possible : ?cs=0.5
const CH = 32;
const CS = (() => { try { const v = parseFloat(new URLSearchParams(location.search).get('cs')); return v > 0 ? v : 0.75; } catch (e) { return 0.75; } })();
const U = CS * CH;            // taille d'un chunk en unités monde
// Niveau de l'eau dans l'aperçu (hauteur en u). Mesuré en jeu (carte de calibration) : la ligne d'eau tombe à ≈ -0,5 u.
// Surcharge possible : ?wl=0.07
const WL = (() => { try { const v = parseFloat(new URLSearchParams(location.search).get('wl')); return isFinite(v) ? v : -0.5; } catch (e) { return -0.5; } })();
const SK = 0.5 / CS;          // conversion des sigmas (calibrés à 0,5 u/échantillon)
const tick = () => new Promise(r => setTimeout(r, 0));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ramp = v => v * v * (3 - 2 * v);
// bruit pour les bords de la carte (déterministe, valeurs dans [-1, 1]) : partagé par le relief (génération) et la couleur (aperçus 2D/3D)
const eHash = (ix, iz, s) => { let h = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(s | 0, 1013904223)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 2147483647.5 - 1; };
const eVal = (x, z, s) => {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = eHash(ix, iz, s), b = eHash(ix + 1, iz, s), c = eHash(ix, iz + 1, s), d = eHash(ix + 1, iz + 1, s);
  return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
};
const edgeWave = (x, z, s) => eVal(x / 28, z / 28, s) * 0.65 + eVal(x / 11 + 31.7, z / 11 - 17.3, s + 7) * 0.35;                // contour ondulé du fondu
const edgeGrain = (x, z, s) => eVal(x / 3.2 + 9.1, z / 3.2 + 4.4, s + 13) * 0.6 + eVal(x / 1.4 - 5.2, z / 1.4 + 11.8, s + 19) * 0.4;   // grain fin

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const r = mulberry32(seed >>> 0);
  let spare = null;
  return {
    random: r,
    uniform: (a, b) => a + (b - a) * r(),
    int: (a, b) => a + Math.floor(r() * (b - a)),
    choice: arr => arr[Math.floor(r() * arr.length)],
    normal() {
      if (spare !== null) { const s = spare; spare = null; return s; }
      let u = 0; while (u === 0) u = r();
      const v = r(), m = Math.sqrt(-2 * Math.log(u));
      spare = m * Math.sin(2 * Math.PI * v);
      return m * Math.cos(2 * Math.PI * v);
    }
  };
}

function gaussian(src, N, sigma) {
  const rad = Math.floor(4 * sigma + 0.5);
  const k = new Float32Array(2 * rad + 1);
  let sum = 0;
  for (let i = -rad; i <= rad; i++) { k[i + rad] = Math.exp(-0.5 * i * i / (sigma * sigma)); sum += k[i + rad]; }
  for (let i = 0; i < k.length; i++) k[i] /= sum;
  const refl = i => { if (i < 0) i = -i - 1; if (i >= N) i = 2 * N - i - 1; return i < 0 ? 0 : i >= N ? N - 1 : i; };
  const tmp = new Float32Array(N * N), out = new Float32Array(N * N);
  for (let r = 0; r < N; r++) {
    const o = r * N;
    for (let c = 0; c < N; c++) {
      let s = 0;
      for (let j = -rad; j <= rad; j++) s += k[j + rad] * src[o + refl(c + j)];
      tmp[o + c] = s;
    }
  }
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      let s = 0;
      for (let j = -rad; j <= rad; j++) s += k[j + rad] * tmp[refl(r + j) * N + c];
      out[r * N + c] = s;
    }
  }
  return out;
}

function placeIslands(rng, nBig, nSmall, half, gap, rbig, rsmall) {
  // La taille de la carte est fixe : si les îles ne tiennent pas, on réduit leurs rayons, l'écart et la marge de bord jusqu'à ce que tout rentre.
  const GF = [1, 0.75, 0.5, 0.3, 0.15, 0]; // d'abord on rapproche les îles (jusqu'à les coller), ensuite seulement on réduit leurs rayons
  for (let k = 0; ; k++) {
    const f = k < GF.length ? 1 : Math.pow(0.92, k - GF.length + 1), gf = k < GF.length ? GF[k] : 0;
    if (f < 0.08) throw new Error('Les îles ne tiennent pas dans la carte : réduisez leur nombre.');
    const margin = 34 * f, g = gap * gf;
    const rb = [rbig[0] * f, rbig[1] * f], rs = [Math.max(1, rsmall[0] * f), Math.max(1, rsmall[1] * f)];
    const placed = [], big = [], small = [];
    const tryPlace = (r, minGap, tries = 1500) => {
      for (let t = 0; t < tries; t++) {
        const lim = half - r - margin;
        if (lim <= 0) return null;
        const x = rng.uniform(-lim, lim), z = rng.uniform(-lim, lim);
        if (placed.every(([px, pz, pr]) => Math.hypot(x - px, z - pz) - r - pr >= minGap)) return [x, z, r];
      }
      return null;
    };
    let ok = true;
    for (let i = 0; i < nBig; i++) {
      const c = tryPlace(rng.uniform(rb[0], rb[1]), g);
      if (!c) { ok = false; break; }
      placed.push(c); big.push(c);
    }
    if (ok) {
      let all = true;
      for (let i = 0; i < nSmall; i++) {
        const c = tryPlace(rng.uniform(rs[0], rs[1]), 28 * g / 45);
        if (!c) { all = false; break; }
        placed.push(c); small.push(c);
      }
      if (all) return { big, small, half, scale: f };
    }
  }
}

async function generate(p, progress, cancelled) {
  const stage = async (pct, label) => {
    progress && progress(pct, label);
    await tick();
    if (cancelled && cancelled()) throw new Error('cancelled');
  };
  const t0 = Date.now();
  const seed = p.seed;
  const rng = makeRng(seed);
  // hauteur du monde infini (base_h) ; au-dessus du niveau de l'eau, le générateur bascule en paysage terrestre (pas d'îles)
  const WH = clamp(Number.isFinite(p.worldH) ? p.worldH : -6, -6, 12);
  const land = WH > WL + 0.01;
  // Profil de terrain propre à chaque hauteur de monde : plaines (part de terrain plat), collines, amplitude du bruit de fond,
  // échelle des montagnes (hauteur / emprise), terrasses (plateau : replats à bords raides), crêtes (hautes terres : relief vif).
  const prof = !land ? { plains: p.plains, hill: 1, landAmp: 1.4, mtn: 1, msz: 1, terrace: 0, ridge: 0 }
    : WH <= 0.75 ? { plains: 0.55, hill: 0.5, landAmp: 0.9, mtn: 0.45, msz: 0.8, terrace: 0, ridge: 0, shore: 1 }      // Rivage : bas, doux, proche de l'eau
    : WH <= 3 ? { plains: 0.9, hill: 0.25, landAmp: 0.55, mtn: 0.35, msz: 0.8, terrace: 0, ridge: 0 }       // Plaine : très plat, quelques ondulations

    for (let i = gx - 1; i <= gx + 1; i++) for (let j = gz - 1; j <= gz + 1; j++) {
      const cell = grid.get(i + ',' + j);
      if (!cell) continue;
      for (const [px, pz, pr] of cell) if ((px - x) ** 2 + (pz - z) ** 2 < (r + pr) ** 2) return false;
    }
    return true;
  };
  const add = (k, x, z, r) => {
    const key = Math.floor(x / 3) + ',' + Math.floor(z / 3);
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push([x, z, r]);
    props.push({
      a: +rng.uniform(-Math.PI, Math.PI).toFixed(3), id: nid, k,
      s: +rng.uniform(0.85, 1.2).toFixed(3), v: rng.int(0, 4),
      x: +x.toFixed(3), z: +z.toFixed(3)
    });
    nid += 7;
  };
  const lo = xs[0] + 2, hi = xs[N - 1] - 2;
  const sampleN = (n, fn, m = 1) => {
    let got = 0, tries = 0;
    n = Math.floor(n * m);
    while (got < n && tries < 400000) {
      tries++;
      const x = rng.uniform(lo, hi), z = rng.uniform(lo, hi);
      const h = hat(x, z);
      if (h >= 0.9 && fn(x, z, h)) got++;
    }
  };
  let landCells = 0;
  for (let i = 0; i < NN; i++) if (H[i] > 0.9) landCells++;
  const kk = landCells * CS * CS / 19500.0 * (land ? 0.7 : 1);
  const dec = ['tree', 'oak', 'beech', 'birch', 'maple', 'tree', 'oak', 'birch', 'beech'];
  const fruit = ['apple', 'cherry', 'poplar', 'old_oak'];
  const R = rng.random;

  const fDec = (x, z, h) => {
    if (h > 7.0) return false;
    if (h > 5 && R() > (7 - h) / 2) return false;
    const f = nz(forest, x, z);
    if (f < 0.1 || R() > 0.12 + 0.35 * Math.min(1, Math.max(0, f))) return false;
    if (slope(x, z) > 0.9 || !free(x, z, 2.6)) return false;

  const fCon = (x, z, h) => {
    if (h < 7.5 || h > 19) return false;
    const pr = Math.min(1, (h - 7.5) / 3) * Math.min(1, (19 - h) / 4);

    if (!free(x, z, 0.9)) return false;

  sampleN(90 * kk, fBush, p.bush); sampleN(320 * kk, fFlow, p.flower); await stage(0.95, 'Végétation');

    name: p.name, season: p.season, maxH, worldH: WH, land, lakes, rivers: nMainRivers, ms: Date.now() - t0
  };
}

async function zlibB64(f32) {
  const stream = new Blob([f32]).stream().pipeThrough(new CompressionStream('deflate'));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let s = '';
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
}

const ORIENTS = [
  (i, j, N) => [i, j],
  (i, j, N) => [j, i],
  (i, j, N) => [i, N - 1 - j],
  (i, j, N) => [N - 1 - i, j],
  (i, j, N) => [N - 1 - i, N - 1 - j],
  (i, j, N) => [j, N - 1 - i],
  (i, j, N) => [N - 1 - j, i],
  (i, j, N) => [N - 1 - j, N - 1 - i]
];
async function buildJSON(res, progress, orient = 0) {
  const { H, N, A0, A1 } = res;
  const om = ORIENTS[orient] || ORIENTS[0];
  const terrain = {};
  const total = (A1 - A0 + 1) ** 2;
  let n = 0;
  for (let ca = A0; ca <= A1; ca++) {
    for (let cb = A0; cb <= A1; cb++) {
      const chunk = new Float32Array(CH * CH);
      let any = false;
      for (let r = 0; r < CH; r++) {
        const gi = (cb - A0) * CH + r, gj0 = (ca - A0) * CH;
        for (let c = 0; c < CH; c++) {
          const [si, sj] = om(gi, gj0 + c, N);
          const v = H[si * N + sj];
          chunk[r * CH + c] = v;
          if (Math.abs(v - res.worldH) > 0.01) any = true;
        }
      }
      if (any) terrain[ca + ',' + cb] = await zlibB64(chunk);
      if (++n % 40 === 0) { progress && progress(n / total); await tick(); }
    }
  }
  const F = v => Number.isInteger(v) ? '__F__' + v : v;
  const props = res.props.map(q => ({ a: F(q.a), id: F(q.id), k: q.k, s: F(q.s), v: F(q.v), x: F(q.x), z: F(q.z) }));
  const data = {
    base_h: F(res.worldH), bases: {}, decor_off: [], fields: [], houses: [], name: res.name,
    next_id: F(res.nextId), props, river_seed: F(-1), season: F(res.season),
    terrain2: terrain, terrain_rev: F(1), towers: [], version: F(2), walls: []
  };
  const text = JSON.stringify(data).replace(/"__F__(-?\d+)"/g, '$1.0');
  return { text, chunks: Object.keys(terrain).length };
}

    if (Math.random() < 0.45) s += pick(E);
    return s.charAt(0).toUpperCase() + s.slice(1);
  };
  // fenêtre « Nom de la carte » à l'export : nom aléatoire proposé par défaut, modifiable ; renvoie le nom choisi ou null si annulé
  function askName() {
    return new Promise(resolve => {
      const m = $('nameModal'), inp = $('nameInput');
      inp.value = rndName(); m.hidden = false;
      setTimeout(() => { inp.focus(); inp.select(); }, 50);
      const done = v => {
        m.hidden = true;
        $('nameOk').removeEventListener('click', ok); $('nameCancel').removeEventListener('click', no);
        $('nameDice').removeEventListener('click', dice); m.removeEventListener('click', bg); inp.removeEventListener('keydown', key);
        resolve(v);
      };
      const ok = () => done((inp.value || '').trim() || rndName()), no = () => done(null);
      const dice = () => { inp.value = rndName(); inp.focus(); inp.select(); };
      const bg = e => { if (e.target === m) no(); };
      const key = e => { if (e.key === 'Enter') { e.preventDefault(); ok(); } else if (e.key === 'Escape') no(); };
      $('nameOk').addEventListener('click', ok); $('nameCancel').addEventListener('click', no);
      $('nameDice').addEventListener('click', dice); m.addEventListener('click', bg); inp.addEventListener('keydown', key);
    });
  }
  $('save').addEventListener('click', async () => {
    if (saving) return;
    saving = true; $('save').disabled = true;
    try {
      const nm = await askName();
      if (nm === null) { toast(t('Enregistrement annulé.')); return; }
      $('mapname').value = nm; persist();   // le nom choisi devient le nom de la carte (champ « Nom de la carte » et champ name du JSON)
      if (cur) { cur.name = nm; cur.json = null; }
      const res = await getJSON();
      const fname = res.name.replace(/[^\w\-]+/g, '_') + '_' + res.seed + '.json';
      const blob = new Blob([res.json.text], { type: 'application/json' });
      const r = await saveBlob(blob, fname, res.json.text);
      if (r === 'saved') toast(t('Carte enregistrée : {0}', fname));
      else if (r === 'declined') toast(t('Enregistrement annulé.'));
      else if (r === 'copied') toast(t('Enregistrement indisponible ici : JSON copié dans le presse-papiers.'));
      else toast(t('Enregistrement indisponible dans cette vue.'));
    } catch (e) {
      if (e && e.code === 'declined') toast(t('Enregistrement annulé.'));
      else toast((e && e.message) || t("L'enregistrement a échoué."));
    } finally { saving = false; $('save').disabled = false; }
  });

  /* ---------- bouton « Télécharger le jeu » : Google Play sur Android, App Store sur iPhone/iPad ---------- */
  // À REMPLACER par les vrais liens des fiches du jeu.
  const STORE_LINKS = {
    android: 'https://play.google.com/store/search?q=Kalecik&c=apps',
    ios: 'https://apps.apple.com/search?term=Kalecik'
  };
  const detectOS = () => {
    const ua = navigator.userAgent || '';
    if (/android/i.test(ua)) return 'android';
    if (/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
    return null;
  };
  const OS = detectOS();
  (function () {
    if (!OS) return;   // ni Android ni iOS : bouton masqué
    const a = $('getGame');
    a.href = STORE_LINKS[OS]; a.hidden = false; a.classList.toggle('ios', OS === 'ios');
    document.querySelector('.dock-in').classList.add('two');
  })();

  function applyLang() {
    document.querySelectorAll('[data-t]').forEach(el => { if (!el.dataset.fr) el.dataset.fr = el.textContent; el.textContent = t(el.dataset.fr); });
    [['rand', 'Aléatoire', 'Aléatoire'], ['dice', 'Au hasard', 'Au hasard'], ['zoomIn', 'Zoom avant', 'Zoom +'], ['zoomOut', 'Zoom arrière', 'Zoom −'], ['optVeg', 'Afficher la végétation', 'Végétation'], ['expand', 'Plein écran', 'Plein écran'], ['dlImg', "Enregistrer l'image", "Enregistrer l'image"]]
      .forEach(([id, a, ti]) => { const e = $(id); e.setAttribute('aria-label', t(a)); e.title = t(ti); });
    $('langBtn').setAttribute('aria-label', t('Réglages'));
    { const pre = { fr: 'Télécharger sur ', en: 'Get it on ', tr: 'İndir: ', es: 'Descargar en ', de: 'Laden bei ' }[lang] || 'Télécharger sur ';
      const g = $('getGame'), lb = pre + (OS === 'ios' ? 'App Store' : 'Google Play'); g.setAttribute('aria-label', lb); g.title = lb; }
    if (typeof applyMode === 'function') { applyMode(); }
    $('langMenu').querySelectorAll('.langopt').forEach(b => b.setAttribute('aria-current', String(b.dataset.c ? b.dataset.c === lang : b.dataset.u === unitPref)));
  }
  function setLang(c) {
    lang = c; document.documentElement.lang = c;
    applyLang(); syncSliders(); persist();
    if (cur) { $('stats').textContent = statsText(cur); paint(); }
  }
  function setUnit(u) {
    unitPref = u; persist(); applyLang(); syncSliders();
    if (cur) { $('stats').textContent = statsText(cur); paint(); }
  }
  (function () {
    const lm = $('langMenu');
    const head = txt => { const h = document.createElement('div'); h.className = 'setting-h'; h.setAttribute('data-t', ''); h.textContent = txt; lm.appendChild(h); };
    head('Langue');
    LANGS.forEach(([c, n]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'langopt'; b.innerHTML = flagEl(c) + '<span>' + n + '</span>'; b.dataset.c = c;
      b.addEventListener('click', () => setLang(c));
      lm.appendChild(b);
    });
    lm.appendChild(document.createElement('hr'));
    head('Unité de mesure');
    [['auto', 'Automatique'], ['m', 'Mètres (m)'], ['ft', 'Pieds (ft)']].forEach(([u, n]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'langopt'; b.dataset.u = u;
      b.innerHTML = '<span data-t>' + n + '</span>';
      b.addEventListener('click', () => setUnit(u));
      lm.appendChild(b);
    });
    lm.addEventListener('click', e => e.stopPropagation());
    $('langBtn').addEventListener('click', e => { e.stopPropagation(); lm.hidden = !lm.hidden; });
    document.addEventListener('click', () => { lm.hidden = true; });
  })();
  /* ---------- menu « Monde » : hauteur du monde infini (base_h) ; au-dessus de l'eau → paysage terrestre ---------- */
  const isLand = () => vals.worldH > WL + 0.01;
  const waterDefaults = () => !isLand() ? { lakes: 0, rivers: 0 } : vals.worldH === 0.5 ? { lakes: 3, rivers: 0 } : vals.worldH === 1 ? { lakes: 1, rivers: 1 } : vals.worldH === 10 ? { lakes: 1, rivers: 0 } : vals.worldH === 6 ? { lakes: 0, rivers: 2 } : { lakes: 2, rivers: 1 };
  const ROW_ISLAND_ONLY = new Set(['gap', 'coast', 'flatCoast', 'bigSize', 'smallSize', 'small']);
  const ROW_ALT = { big: 'Massifs' };
  const ROW_MODE = { fissures: [6], fissureWidth: [6], crevasses: [6], canyons: [10], canyonDepth: [10] };   // Plateau : fissures et crevasses ; Hautes terres : canyons
  function applyMode() {
    const land = isLand();
    DEFS.concat(ADV).forEach(d => {
      const row = $('s-' + d.id).closest('.row');
      row.hidden = (land && ROW_ISLAND_ONLY.has(d.id)) || (!!ROW_MODE[d.id] && !(land && ROW_MODE[d.id].includes(vals.worldH)));
      if (ROW_ALT[d.id]) { const sp = row.querySelector('.lt span'); sp.dataset.fr = land ? ROW_ALT[d.id] : d.label; sp.textContent = t(sp.dataset.fr); }
    });
    const tb = tabBtns['Archipel']; tb.dataset.fr = land ? 'Paysage' : 'Archipel'; tb.textContent = t(tb.dataset.fr);
    document.querySelectorAll('#modeBtns .mode').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.h) === vals.worldH)));
  }
  document.querySelectorAll('#modeBtns .mode').forEach(b => b.addEventListener('click', () => {
    const h = Number(b.dataset.h);
    if (h === vals.worldH) return;
    const was = isLand(), prevH = vals.worldH;
    vals.worldH = h;
    { const WW = { 0.5: 1.7, 1: 1.7, 6: 1.8, 10: 1.7 }; vals.waterWidth = WW[h] || DEFVALS.waterWidth; }   // Rivage, Plateau et Hautes terres : rivières et lacs plus larges par défaut
    if (isLand() !== was || h === 0.5 || prevH === 0.5 || h === 1 || prevH === 1 || h === 10 || prevH === 10 || h === 6 || prevH === 6) { const w = waterDefaults(); vals.lakes = w.lakes; vals.rivers = w.rivers; }   // valeurs par défaut du nouveau mode : 1 rivière + 2 lacs en paysage terrestre ; Rivage : 3 rivières + 1 lac (le terrain y crée déjà beaucoup de cuvettes naturelles)
    if (h === 10) vals.canyons = 3; else if (prevH === 10) vals.canyons = DEFVALS.canyons;   // Hautes terres : canyons par défaut
    syncSliders(); persist(); run();
  }));
  document.documentElement.lang = lang;
  applyLang();
  run();   // démarrage direct en mode archipel (worldH = -6)
})();
</script>

<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
